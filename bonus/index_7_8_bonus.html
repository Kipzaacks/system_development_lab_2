<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koske Inc | Systems Development</title>

    <link rel="stylesheet" href="style/style.css">
    <script src="style/script.js" defer></script>

<body>

    <div class="container">

        <h1>Welcome to My Blog</h1>

        <p>
            Let's customise the articles that you will see.
            Please enter a list of interests below.
        </p>

        <input type="text" id="interests" placeholder="Enter your interests">
        <button id="submit_interests">Search</button>

        <p id="output">
            Then, you can explore articles based on your interests:
        </p>

        <div id="msgbox">

            <h3>Examples of Interests</h3>

            <ul>
                <li>Cooking</li>
                <li>Software Development</li>
                <li>Travel</li>
            </ul>

        </div>

        <div id="msgbox">

            <h3>My Interests</h3>

            <ul id="myinterests"></ul>

        </div>

    </div>

</body>
